<div class="bell-wrapper">
  <button class="bell-btn" (click)="toggleDropdown()" [class.has-unread]="unreadCount > 0" title="แจ้งเตือน">
    🔔
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
  </button>

  <div class="notif-dropdown" *ngIf="showDropdown" (click)="$event.stopPropagation()">
    <div class="notif-header">
      <span class="notif-title">การแจ้งเตือน</span>
      <button class="mark-all-btn" (click)="markAllRead()" *ngIf="unreadCount > 0">อ่านทั้งหมด</button>
    </div>

    <div class="notif-loading" *ngIf="loading">กำลังโหลด...</div>

    <ul class="notif-list" *ngIf="!loading">
      <li class="notif-item" *ngFor="let n of notifications"
        [class.unread]="!n.isRead" (click)="markRead(n)">
        <div class="notif-dot" *ngIf="!n.isRead"></div>
        <div class="notif-body">
          <p class="notif-text-title">{{ n.title }}</p>
          <p class="notif-text-msg">{{ n.message }}</p>
          <span class="notif-time">{{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
      </li>
      <li class="notif-empty" *ngIf="notifications.length === 0">ไม่มีการแจ้งเตือน</li>
    </ul>
  </div>
</div>
